[package]
name = "fracindex"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A fast, space-efficient fractional index implementation."
repository = "https://github.com/PeterlitsZo/fracindex"
readme = "README.md"
keywords = [ "fractional-indexing", "ordering", "sequence" ]
categories = [ "algorithms", "data-structures" ]
exclude = [ "AGENTS.md" ]

[dependencies]
smallvec = "1.15.2"

[dev-dependencies]
criterion = "0.8.2"
fractional_index = { version = "2.0.2", default-features = false }
rand = "0.10.2"

[[bench]]
name = "comparison"
harness = false
